<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Absolute hrefs below are rewritten by Vite against `base`, so they work
         both at `/` (Vercel) and at `/console/` (Caddy and Docker). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3B6FE0" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RecSterio Ops" />
    <title>RecSterio console · dataset operations</title>
    <meta
      name="description"
      content="RecSterio operations console: manage dataset folders, share links, passcodes and the transcription queue."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking: the console must render even when the font CDN is slow or offline. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
